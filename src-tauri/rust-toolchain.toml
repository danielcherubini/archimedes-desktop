# The Rust toolchain this app builds and lint-checks against. rustup resolves
# it from this directory, so `cargo test` / `cargo clippy` in `src-tauri/` and
# CI (which runs these steps with `working-directory: src-tauri`) use the SAME
# compiler. That is the whole point of the file: `cargo clippy` is the gate
# (AGENTS.md) and a lint that floats in a newer rustc reddens `main` while
# staying unreproducible locally — `clippy::drain_collect` shipped in 1.99 and
# could not be reproduced on 1.95. Bump it deliberately, and re-run the
# AGENTS.md bar in the same change.
#
# `components` is required, not boilerplate: both gates run here
# (`cargo fmt --all -- --check`, `cargo clippy --all-targets`), a minimal
# profile installs neither, and `rustup toolchain install --component …` on the
# command line is IGNORED when no toolchain is named — the file is the only
# place the pair is reliably recorded. No `targets`: every job builds its own
# host (ci.yml is Linux-only, release.yml runs one OS per job), so nothing
# cross-compiles.
[toolchain]
channel = "1.99.0"
components = ["clippy", "rustfmt"]
