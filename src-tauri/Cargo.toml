[package]
name = "archimedes-desktop"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# Two binaries exist (the app + the dev-only fake_agent fixture); tell cargo
# which one `cargo run` (and thus `tauri dev`) should launch.
default-run = "archimedes-desktop"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "archimedes_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "macros", "time", "net", "rt"] }
thiserror = "2"
agent-client-protocol = "2"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
rusqlite = { version = "0.37", features = ["bundled"] }

[dev-dependencies]
serde_json = "1"
agent-client-protocol = "2"
# Enables `tauri::test` (mock runtime) for the headless IPC test.
tauri = { version = "2", features = ["test"] }

# Platform-gated bridge deps: `libc` (SO_PEERCRED / ucred) is only needed on
# Linux, the `windows` crate (named-pipe client pid + Toolhelp) only on
# Windows — a top-level dep would pull each into the other platform's build.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# The `windows` crate features are for the `TODO(windows)` named-pipe
# implementation in `bridge.rs` (the client pid via
# `GetNamedPipeClientProcessId` — `Win32_System_Pipes`; the Toolhelp
# parent walk — `Win32_System_Diagnostics_ToolHelp`; the
# `FILE_FLAG_FIRST_PIPE_INSTANCE` pre-squat detection —
# `Win32_Storage_FileSystem`): the v1 Windows stub uses NONE of them,
# but the features are kept so the implementation doesn't need a
# Cargo.toml change.
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Storage_FileSystem"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
