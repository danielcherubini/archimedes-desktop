[package]
name = "archimedes-desktop"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# Two binaries exist (the app + the dev-only fake_agent fixture); tell cargo
# which one `cargo run` (and thus `tauri dev`) should launch.
default-run = "archimedes-desktop"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "archimedes_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "macros", "time"] }
thiserror = "2"
agent-client-protocol = "2"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
rusqlite = { version = "0.37", features = ["bundled"] }

[dev-dependencies]
serde_json = "1"
agent-client-protocol = "2"
# Enables `tauri::test` (mock runtime) for the headless IPC test.
tauri = { version = "2", features = ["test"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
