[package]
name = "archimedes"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# Two binaries exist (the app + the dev-only `fake_pi` fixture — a
# stand-in for the real `pi --mode rpc` agent in integration tests); tell
# cargo which one `cargo run` (and thus `tauri dev`) should launch.
default-run = "archimedes"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "archimedes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
# The on-disk state dirs (`~/.config/archimedes`, `~/.local/share/archimedes`,
# `~/Library/Application Support/archimedes`, …) — the same crate Tauri uses
# to resolve the platform base dirs, joined with a bare `archimedes` (NOT
# the bundle identifier: Tauri's own `config_dir()` / `app_data_dir()`
# append the identifier, which would give `…/codes.archimedes.desktop`).
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "macros", "time", "net", "rt"] }
tokio-util = "0.7"
# The `exec_find` fallback when `fd` is not installed (walk the cwd tree).
walkdir = "2"
# base64 for the `read` tool's image content blocks (pi's `ImageContent` =
# `{type: "image", data, mimeType}` — `data` is base64, no `data:` prefix).
base64 = "0.22"
thiserror = "2"
# The native harness's model client (native-agent-harness Task 4): an
# OpenAI-compatible chat-completions client (streaming SSE). `rustls-tls`
# (default features off) avoids a system-OpenSSL build dependency;
# `stream` provides `bytes_stream`, `json` the request body.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
# `BoxStream` (the `Provider`'s returned stream) + `StreamExt` (consuming
# it in the `AgentLoop`, Task 6) — `futures-core` alone has `BoxStream`
# but no `.next()`, so the full `futures-util` is needed.
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
# OAuth 2.1 (the native `mcp` tool's HTTP-server auth, ADR 0018): `sha2`
# (the PKCE S256 challenge) + `rand` (the PKCE verifier + the callback
# `state` entropy).
sha2 = "0.10"
rand = "0.9"
async-trait = "0.1"
rusqlite = { version = "0.37", features = ["bundled"] }
# System-clipboard image read for the WebKitGTK paste fallback (Wayland
# `wl-clipboard-rs` backend when `WAYLAND_DISPLAY` is set, X11 otherwise).
arboard = { version = "3.6", features = ["wayland-data-control"] }
image = { version = "0.25", features = ["png"] }

[dev-dependencies]
serde_json = "1"
# Enables `tauri::test` (mock runtime) for the headless IPC test.
tauri = { version = "2", features = ["test"] }
# Mock HTTP server for the `Provider` integration tests (canned SSE
# streams, canned status codes).
wiremock = "0.6"
# Temp dirs for the `ModelCatalog` seeding tests (Task 5) — the
# `~/.pi/agent` fixture is written into a temp dir (pointing `seed_from`
# at a real `HOME` would be racy).
tempfile = "3"

# Platform-gated bridge deps: `libc` is needed on ALL unix platforms — Linux
# for the bridge's `SO_PEERCRED`/`ucred` peer verification (those specific
# uses stay `#[cfg(target_os = "linux")]`-gated) and macOS because
# `run_sudo_real`'s `#[cfg(unix)]` `setpgid`/`kill` (process-group kill) code
# compiles there too (the bridge is inert on macOS, but the code must still
# COMPILE). The `windows` crate (named-pipe client pid + Toolhelp) is only on
# Windows — a top-level dep would pull each into the other platform's build.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# The `windows` crate features are for the `TODO(windows)` named-pipe
# implementation in `bridge.rs` (the client pid via
# `GetNamedPipeClientProcessId` — `Win32_System_Pipes`; the Toolhelp
# parent walk — `Win32_System_Diagnostics_ToolHelp`; the
# `FILE_FLAG_FIRST_PIPE_INSTANCE` pre-squat detection —
# `Win32_Storage_FileSystem`): the v1 Windows stub uses NONE of them,
# but the features are kept so the implementation doesn't need a
# Cargo.toml change.
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Storage_FileSystem"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
